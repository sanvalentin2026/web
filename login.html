<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>San Valentin | Iniciar sesion</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext x='50%25' y='50%25' dominant-baseline='central' text-anchor='middle' font-size='80'%3E❤️%3C/text%3E%3C/svg%3E">
    <link rel="mask-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext x='50%25' y='50%25' dominant-baseline='central' text-anchor='middle' font-size='80'%3E❤️%3C/text%3E%3C/svg%3E" color="#ff375f">
    <link rel="apple-touch-icon" href="https://fav.farm/❤️">
    <link rel="stylesheet" href="css/verification.css">
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
        <script>
    // Este código se ejecuta ANTES de que el body exista
    (function() {
        const guardado = localStorage.getItem('tema-usuario') || 'modo-claro';
        document.documentElement.className = guardado;
        
        // Sincronizar el color de fondo del HTML de inmediato
        const color = (guardado === 'modo-oscuro') ? '#1c1c1e' : '#ffffff';
        document.documentElement.style.backgroundColor = color;
    })();
</script>
</head>
<body>
    <div id="loader-global" class="loader-overlay">
    <div class="apple-spinner"></div>
    </div>
  <div class="auth-container">
    <h2 id="titulo" class="h2-especial">Iniciar sesión</h2>

    <div class="input-group">
      <i class="fa fa-user"></i>
      <input type="text" id="username" placeholder="Nombre de usuario">
    </div>

    <div class="input-group">
      <i class="fa fa-lock"></i>
      <input type="password" id="password" placeholder="Contraseña">
    </div>

    <button id="btnPrincipal" onclick="login()">Iniciar sesión</button>

    <p class="toggle">
      <span id="textoToggle">¿No tiene una cuenta? | </span>
      <a href="register.html">Crear una cuenta</a>
    </p>
  </div>
<!-- Scripts optimizados al final para mejor rendimiento -->
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-config.js"></script>
<script type="module" src="js/auth.js"></script>
<script type="module" src="js/themes.js"></script>
<script type="module" src="js/prescense.js"></script>
</body>
</html>
