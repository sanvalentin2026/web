<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil de usuario</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/common.css">
    <link rel="apple-touch-icon" href="https://fav.farm/❤️">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext x='50%25' y='50%25' dominant-baseline='central' text-anchor='middle' font-size='80'%3E❤️%3C/text%3E%3C/svg%3E">
    <link rel="mask-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext x='50%25' y='50%25' dominant-baseline='central' text-anchor='middle' font-size='80'%3E❤️%3C/text%3E%3C/svg%3E" color="#ff375f">
    <link rel="stylesheet" href="css/perfil.css">
</head>
<body>
    <div id="loader-global" class="loader-overlay">
    <div class="apple-spinner"></div>
    </div>

<header class="main-header">
        <div class="header-container">
            <div style="display: flex; align-items: center; gap: 15px;">
                <a href="index.html" style="color: #969696; font-size: 1.2rem;"><i class="fa-solid fa-chevron-left"></i></a>
                <h2 class="title">Perfil</h2>
            </div>
            <div class="header-right">
               <span style="font-weight: 400; opacity: 0.8;">CRC | </span> <span id="reloj" style="font-weight: 400; opacity: 0.8;">00:00:00</span>
            </div>
        </div>
    </header>

    <main class="perfil-grid">
        <aside class="card-perfil">
            <div class="avatar-edit">
                <img id="imgPerfil" src="imgs/usuario.png" alt="Avatar">
                <label for="inputFoto" class="btn-foto">
                    <i class="fa-solid fa-camera"></i>
                </label>
                <input type="file" id="inputFoto" hidden accept="image/*">
            </div>
            
            <div class="info-usuario">
                <h2 id="nombrePerfil">Cargando...</h2>
                <div id="contenedorInsignias" class="badges-list"></div>
            </div>

            <nav class="perfil-menu">
                <p>• Preferencias</p>
                                <button onclick="cambiarTema()" class="menu-btn"><i class="fa-solid fa-palette"></i> Cambiar Tema</button>
                                <p>• Acciones</p>
                <a href="reportar.html" class="menu-btn report-btn" title="Reportar un error">
                    <i class="fa-solid fa-headset"></i>Soporte</a>
                <button onclick="confirmarSalida()" class="menu-btn logout"><i class="fa-solid fa-right-from-bracket"></i> Cerrar Sesión</button>
            </nav>
        </aside>

        <section class="card-usuarios">
            <div class="section-header">
                <h3><i class="fa-solid fa-circle-dot" style="color: #34c759;"></i>  Usuarios conectados</h3>
            </div>

            <div id="listaUsuarios" class="lista-presencia">
                </div>
        </section>
    </main>
        <footer class="main-footer">
        <div class="footer-content">
            <p class="copyright">&copy; 2026 Todos los derechos reservados</p>
        </div>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-config.js"></script>
    <script src="js/perfil_extra.js"></script>
    <script type="module" src="js/perfil.js"></script>
    <script type="module" src="js/prescense.js"></script>
</body>
</html>
