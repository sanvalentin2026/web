<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil de usuario</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
    <link rel="apple-touch-icon" href="https://fav.farm/❤️">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext x='50%25' y='50%25' dominant-baseline='central' text-anchor='middle' font-size='80'%3E❤️%3C/text%3E%3C/svg%3E">
    <link rel="mask-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext x='50%25' y='50%25' dominant-baseline='central' text-anchor='middle' font-size='80'%3E❤️%3C/text%3E%3C/svg%3E" color="#ff375f">
    <style>
/* --- VARIABLES DE TEMA --- */
.modo-oscuro {
    --primary: #ff375f;
    --bg-page: #000000;
    --card: #1c1c1e;
    --text-main: #ffffff;
    --text-muted: #8e8e93;
    --border-ranking: rgba(255, 255, 255, 0.1);
    --glass: rgba(255, 255, 255, 0.05);
    --glass-border: rgba(255, 255, 255, 0.1);
}

.modo-claro {
    --primary: #ff375f;
    --bg-page: #FFF0F6;
    --card: #ffffff;
    --text-main: #1c1c1e;
    --text-muted: #636366;
    --border-ranking: rgba(0, 0, 0, 0.1);
    --glass: rgba(0, 0, 0, 0.03);
    --glass-border: rgba(0, 0, 0, 0.08);
}

/* --- ESTILOS BASE --- */
body {
    background-color: var(--bg-page);
    color: var(--text-main);
    transition: background 0.3s, color 0.3s;
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
}

.title{
    font-family: 'Dancing Script', cursive;
    color: var(--primary);
}

/* --- GRID Y CONTENEDORES --- */
.perfil-grid {
    max-width: 1100px;
    margin: 40px auto;
    padding: 20px;
    display: grid;
    grid-template-columns: 300px 1fr;
    gap: 25px;
}

.card-perfil, .card-usuarios {
    background: var(--card);
    border-radius: 24px;
    padding: 30px;
    border: 1px solid var(--border-ranking);
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
}

/* --- LISTA DE USUARIOS CON SCROLL (LA CLAVE) --- */
#listaUsuarios {
    max-height: 500px; /* Ajusta esta altura según prefieras */
    overflow-y: auto;
    padding-right: 8px; /* Espacio para el scroll */
}

/* Scrollbar Personalizado */
#listaUsuarios::-webkit-scrollbar {
    width: 6px;
}

#listaUsuarios::-webkit-scrollbar-track {
    background: transparent;
}

#listaUsuarios::-webkit-scrollbar-thumb {
    background: var(--glass-border);
    border-radius: 10px;
}

#listaUsuarios::-webkit-scrollbar-thumb:hover {
    background: var(--primary);
}

/* --- CARD DE PERFIL STICKY --- */
.card-perfil {
    text-align: center;
    height: fit-content;
    position: sticky;
    top: 100px;
}

/* --- AVATAR --- */
.avatar-edit {
    position: relative;
    width: 140px;
    height: 140px;
    margin: 0 auto 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
}

.avatar-edit img {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    object-fit: cover;
    border: 4px solid var(--primary);
    box-shadow: 0 0 20px rgba(255, 55, 95, 0.2);
}

.btn-foto {
    position: absolute;
    bottom: 5px;
    right: 5px;
    background: var(--primary);
    color: white !important;
    width: 38px;
    height: 38px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    border: 3px solid var(--card);
    z-index: 2;
}

/* --- INSIGNIAS --- */
.badges-list {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 10px;
}

.insignia {
    padding: 4px 12px;
    border-radius: 6px;
    font-size: 0.7rem;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.5px;
}

.insignia.admin { background: #007bff; color: white !important; }
.insignia.dev { background: #e3250c; color: white !important; }
.insignia.vendedor { background: #28a745; color: white !important; }

/* --- USUARIOS EN LA LISTA --- */
.usuario-item {
    display: flex;
    align-items: center;
    padding: 12px 15px;
    border-radius: 16px;
    margin-bottom: 10px;
    background: var(--glass);
    border: 1px solid var(--glass-border);
    transition: 0.2s ease;
    cursor: pointer;
    margin-top: 10px;
}

.usuario-item:hover {
    background: var(--glass-border);
    transform: translateX(5px);
}

.detalles-user .nombre {
    font-weight: 600;
    color: var(--text-main) !important;
    display: block;
    font-size: 0.95rem;
}

.detalles-user .conexion {
    font-size: 0.75rem;
    color: var(--text-muted);
}

.punto-estado {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    margin-right: 15px;
    background: #34c759;
    box-shadow: 0 0 10px #34c759;
}

/* --- HEADER --- */
.main-header {
    backdrop-filter: blur(5px);
    position: sticky;
    top: 0;
    z-index: 1000;
    padding: 10px 0;
    width: 95%;
    max-width: 1300px;
    margin: 15px auto;
    background: var(--glass);
    border: 1px solid var(--glass-border) !important;
    border-radius: 15px;
}

/* --- RESPONSIVE --- */
@media (max-width: 850px) {
    .perfil-grid { grid-template-columns: 1fr; margin: 20px auto; }
    .card-perfil { position: relative; top: 0; }
}

@media (max-width: 400px){
    .main-header { width: 89%; }
    .card-perfil { padding: 20px; }
}
/* --- MENÚ DE ACCIONES (RESTABLECIDO) --- */
.perfil-menu {
    margin-top: 25px;
    display: flex;
    flex-direction: column;
    gap: 12px;
}
h2{
    color: #ff375f;
}

.menu-btn {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 20px;
    border-radius: 14px;
    background: var(--glass);
    color: var(--text-main);
    text-decoration: none;
    transition: all 0.3s ease;
    border: 1px solid var(--glass-border);
    cursor: pointer;
    font-size: 0.95rem;
    font-weight: 500;
    justify-content: flex-start;
}


/* Iconos dentro de los botones */
.menu-btn i {
    font-size: 1.1rem;
    width: 20px;
    text-align: center;
}

/* Ajuste para Modo Claro */
.modo-claro .menu-btn {
    background: #ffffff;
    border: 1px solid #d1d1d6;
}
/* 1. Limitamos la tarjeta principal */
.card-usuarios {
    background: var(--card);
    border-radius: 24px;
    padding: 30px;
    border: 1px solid var(--border-ranking);
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
    
    /* ESTO ES LO NUEVO: */
    height: 544px;           /* Altura fija para que no crezca más */
    display: flex;           /* Usamos flex para organizar el header y la lista */
    flex-direction: column;  /* Uno arriba del otro */
}

/* 2. El área donde están los usuarios */
#listaUsuarios {
    flex-grow: 1;            /* Ocupa todo el espacio restante de la tarjeta */
    overflow-y: auto;        /* Si hay muchos usuarios, aparece el scroll aquí */
    padding-right: 10px;     /* Espacio para que el scroll no tape las fotos */
    margin-top: 10px;
}

/* 3. Diseño del Scrollbar (Opcional para que se vea premium) */
#listaUsuarios::-webkit-scrollbar {
    width: 6px;
}

#listaUsuarios::-webkit-scrollbar-thumb {
    background: var(--primary);
    border-radius: 10px;
}

#listaUsuarios::-webkit-scrollbar-track {
    background: transparent;
}
.modo-claro #listaUsuarios::-webkit-scrollbar-thumb {
    background: grey;
    border-radius: 10px;
}
.volver {
    /* Reseteo y transparencia */
    background: transparent;
    border: 1px solid var(--glass-border);
    color: var(--text-main);
    
    /* Diseño y espaciado */
    padding: 10px 24px;
    border-radius: 20px;
    font-size: 0.9rem;
    font-weight: 500;
    cursor: pointer;
    
    /* Alineación interna */
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;

    /* Centrado */
    margin: 0 auto 20px auto; 
    width: fit-content;
    position: relative;
    
    /* Transiciones */
    transition: all 0.3s ease;
    outline: none;

    /* Evitar que el texto se parta en dos líneas */
    white-space: nowrap; 
}

.volver i {
    font-size: 1rem;
}

/* --- RESPONSIVE --- */
@media (max-width: 600px) {
    .volver {
        padding: 8px 18px;    /* Un poco más pequeño en móviles */
        font-size: 0.85rem;   /* Reducción ligera de la fuente */
        margin-bottom: 15px;  /* Menos margen inferior */
    }

    .volver i {
        font-size: 0.9rem;
    }
}
    </style>
</head>
<body class="modo-oscuro">

<header class="main-header">
        <div class="header-container">
            <div style="display: flex; align-items: center; gap: 15px;">
                <a href="index.html" style="color: white; font-size: 1.2rem;"><i class="fa-solid fa-chevron-left"></i></a>
                <h2 class="title">Perfil</h2>
            </div>
            <div class="header-right">
               <span style="font-weight: 600; opacity: 0.8;">CRC | </span> <span id="reloj" style="font-weight: 600; opacity: 0.8;">00:00:00</span>
            </div>
        </div>
    </header>

    <main class="perfil-grid">
        <aside class="card-perfil">
            <div class="avatar-edit">
                <img id="imgPerfil" src="imgs/usuario.png" alt="Avatar">
                <label for="inputFoto" class="btn-foto">
                    <i class="fa-solid fa-camera"></i>
                </label>
                <input type="file" id="inputFoto" hidden accept="image/*">
            </div>
            
            <div class="info-usuario">
                <h2 id="nombrePerfil">Cargando...</h2>
                <div id="contenedorInsignias" class="badges-list"></div>
            </div>

            <nav class="perfil-menu">
                <a href="stats.html" class="menu-btn"><i class="fa-solid fa-chart-line"></i> Estadisticas</a>
                <a href="stock.html" class="menu-btn">Inventario</a>
                <button onclick="cambiarTema()" class="menu-btn"><i class="fa-solid fa-palette"></i> Cambiar Tema</button>
                <button onclick="confirmarSalida()" class="menu-btn logout"><i class="fa-solid fa-right-from-bracket"></i> Cerrar Sesión</button>
            </nav>
        </aside>

        <section class="card-usuarios">
            <div class="section-header">
                <h3><i class="fa-solid fa-circle-dot" style="color: #34c759;"></i>  Personas conectadas</h3>
            </div>

            <div id="listaUsuarios" class="lista-presencia">
                </div>
        </section>
    </main>

    <script type="module" src="js/perfil.js"></script>
    <script type="module" src="js/prescense.js"></script>

    <script>
        // Función rápida para el reloj del header
setInterval(() => {
    const elReloj = document.getElementById('reloj');
    if (elReloj) {
        elReloj.textContent = new Date().toLocaleTimeString();
    }
}, 1000);
        // Lógica de Cerrar Sesión con SweetAlert
function confirmarSalida() {
    const esClaro = localStorage.getItem('tema-usuario') === 'modo-claro';

    Swal.fire({
        title: '¿Cerrar sesión?',
        icon: 'warning',
        showCancelButton: true,
        confirmButtonColor: '#ff375f',
        cancelButtonColor: esClaro ? '#d1d1d6' : '#3a3a3c',
        confirmButtonText: 'Confirmar',
        cancelButtonText: 'Cancelar',
        // --- ADAPTACIÓN DE TEMA ---
        background: esClaro ? '#ffffff' : '#1c1c1e',
        color: esClaro ? '#1c1c1e' : '#ffffff',
        didOpen: (popup) => {
            // Aplicamos los bordes redondeados de 20px
            popup.style.borderRadius = '20px';
            
            // Opcional: Si quieres que el título también esté alineado a la izquierda
            const title = popup.querySelector('.swal2-title');
            if (title) {
                title.style.textAlign = 'center'; // En diálogos grandes suele verse mejor centrado, pero puedes cambiarlo a 'left'
            }
        }
    }).then((result) => {
        if (result.isConfirmed) {
            localStorage.removeItem("usuario");
            window.location.href = "login.html";
        }
    });
}
        function aplicarTemaGuardado() {
    const tema = localStorage.getItem('tema-usuario');
    
    if (tema === 'modo-claro') {
        document.body.classList.remove('modo-oscuro');
        document.body.classList.add('modo-claro');
    } else {
        // Por defecto o si es modo-oscuro
        document.body.classList.remove('modo-claro');
        document.body.classList.add('modo-oscuro');
    }
}

// 2. Función para el botón de cambiar tema
window.cambiarTema = function() {
    const esClaro = document.body.classList.contains('modo-claro');
    
    if (esClaro) {
        document.body.classList.replace('modo-claro', 'modo-oscuro');
        localStorage.setItem('tema-usuario', 'modo-oscuro');
    } else {
        document.body.classList.replace('modo-oscuro', 'modo-claro');
        localStorage.setItem('tema-usuario', 'modo-claro');
    }
}

// Asegúrate de llamar a aplicarTemaGuardado al inicio
document.addEventListener('DOMContentLoaded', () => {
    aplicarTemaGuardado();
});
    </script>
</body>
</html>
