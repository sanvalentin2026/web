<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mantenimiento en curso</title>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --bg: #1c1c1e; --txt: #ffffff; --accent: #e11d48; --loader-track: rgba(255, 255, 255, 0.1); }
        body.light { --bg: #ffffff; --txt: #000000; --loader-track: rgba(0, 0, 0, 0.1); }

        html, body { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            background: var(--bg); color: var(--txt); 
            font-family: 'Segoe UI', Roboto, sans-serif; overflow: hidden; 
            transition: background 0.3s, color 0.3s;
        }

        .flex-center { display: flex; height: 100vh; align-items: center; justify-content: center; text-align: center; }
        
        h1 { font-size: clamp(2rem, 10vw, 3.5rem); font-weight: 900; margin: 0; color: var(--accent); letter-spacing: -1px; }

        /* Spinner Corregido */
        .loader { 
            border: 5px solid var(--loader-track); 
            border-top: 5px solid var(--accent); 
            border-radius: 50%; 
            width: 50px; 
            height: 50px; 
            animation: spin 1s linear infinite; 
            margin: 25px auto; 
            display: block;
        }

        @keyframes spin { to { transform: rotate(360deg); } }
        
        #installing-msg { min-height: 1.5em; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="flex-center">
        <div>
            <h1>ACTUALIZANDO...</h1>
            <p id="installing-msg" style="font-size: 1.2rem; font-weight: bold;"></p>
            <div class="loader"></div>
            <p style="opacity: 0.5; font-size: 0.9rem;">La conexión se restaurará automáticamente al finalizar.</p>
        </div>
    </div>

    <script>
        // Inicialización del cliente
        const supabaseClient = supabase.createClient('https://yujwifmejokfbxndhtnf.supabase.co', 'sb_publishable_6IDYbrnJ3X4Z-mTsZ1TXQA_nwUTiFno');
        
        // Aplicar clase de tema inmediatamente para evitar parpadeo blanco
        if (localStorage.getItem('tema') === 'claro') {
            document.body.classList.add('light');
        }
    </script>
    
    <script src="js/mantenimiento.js"></script>
</body>
</html>
