<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Reportar un problema</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://unpkg.com; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://fonts.googleapis.com; style-src-elem 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com; img-src 'self' data:; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://cdn.jsdelivr.net;">

<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text x='50%' y='50%' dominant-baseline='central' text-anchor='middle' font-size='80'>❤️</text></svg>">

<link rel="apple-touch-icon" href="https://fav.farm/❤️">
  
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <style>
    html { background-color: #050505; } 
    * { box-sizing: border-box; }

    /* --- ESTILO PARA LAS ALERTAS REDONDEADAS --- */
    .mi-borde-redondeado {
      border-radius: 20px !important;
    }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: linear-gradient(135deg, #ffe4f1, #fff);
      min-height: 100vh;
      padding: 20px;
      color: #333;
      transition: background 0.3s ease;
      display: none; 
    }

    .container { max-width: 600px; margin: 0 auto; }
    h1 { text-align: center; font-size: 32px; margin-bottom: 8px; color: #e63946; }
    .sub { text-align: center; color: #666; margin-bottom: 24px; font-size: 15px; }
    
    form {
      background: #fff;
      padding: 22px;
      border-radius: 16px;
      box-shadow: 0 12px 28px rgba(0,0,0,0.08);
      display: grid;
      gap: 14px;
    }

    label { font-weight: 600; font-size: 14px; color: #444; }
    input, textarea, select {
      padding: 12px;
      border-radius: 10px;
      border: 1px solid #F3C1D9;
      font-size: 16px;
      width: 100%;
    }

    textarea { min-height: 120px; resize: vertical; }
    button {
      margin-top: 10px;
      padding: 14px;
      border-radius: 12px;
      border: none;
      background: #ff375f;
      color: white;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s;
    }
    button:active { transform: scale(0.98); }
    button:disabled { opacity: 0.6; cursor: not-allowed; }

    .btn-volver {
      background: none; border: none; color: #ff4d6d;
      font-size: 15px; font-weight: 600; cursor: pointer;
      margin-bottom: 14px;
    }

    /* MODO OSCURO */
    body.modo-oscuro {
      background: radial-gradient(circle at top, #1a1a1a 0%, #050505 100%) !important;
      color: #f5f5f7;
    }
    .modo-oscuro h1 { color: #ff375f; }
    .modo-oscuro .sub { color: #a1a1a6; }
    .modo-oscuro form {
      background: rgba(28, 28, 30, 0.75);
      backdrop-filter: blur(25px) saturate(180%);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .modo-oscuro label { color: #e5e5e7; }
    .modo-oscuro input, .modo-oscuro textarea, .modo-oscuro select {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #ffffff;
    }
    option{
      color: black;
    }

    @media (max-width: 600px) {
      body { padding: 14px; }
      h1 { font-size: 24px; }
    }
  </style>
</head>
<body>

  <script>
    (function() {
      const tema = localStorage.getItem('tema-usuario') || 'modo-oscuro';
      document.body.classList.add(tema);
    })();
  </script>

  <button class="btn-volver" onclick="history.back()">← Volver atrás</button>
  
  <div class="container">
    <h1>Reportar un problema</h1>
    <p class="sub">Si algo no funciona bien, repórtelo aquí.</p>

    <form id="formReporte">
      <label for="tipo">Tipo de reporte</label>
      <select id="tipo" required>
        <option value="soporte">Soporte</option>
        <option value="error">Error / No funciona</option>
        <option value="visual">Problema visual</option>
        <option value="lento">Lentitud</option>
        <option value="otro">Otro</option>
      </select>

      <label for="descripcion">¿Qué ocurrió?</label>
      <textarea id="descripcion" placeholder="Describa lo que pasó..." required></textarea>

      <label for="version">Versión de la web</label>
      <input id="version" placeholder="Ej: v1.3.14 (Actual)" required>

      <label for="entorno">Dispositivo y navegador</label>
      <input id="entorno" placeholder="Ej: iPhone · Safari" required>

      <button type="submit" id="btnEnviar">Enviar reporte</button>
    </form>
  </div>

  <script type="module">
    import { verificarSesion, supabase, obtenerTema } from './js/auth.js'; 

    const init = async () => {
      try {
        await verificarSesion();
        document.body.style.display = 'block';
      } catch (e) {
        window.location.replace("login.html");
      }
    };
    init();

    const form = document.getElementById("formReporte");
    const btn = document.getElementById("btnEnviar");

    form.addEventListener("submit", async e => {
      e.preventDefault();
      const tema = obtenerTema(); // Traemos el objeto completo de auth.js

      btn.disabled = true;
      btn.textContent = "Enviando...";

      const { error } = await supabase.from("reportes_web").insert({
        tipo: document.getElementById("tipo").value,
        descripcion: document.getElementById("descripcion").value.trim(),
        version: document.getElementById("version").value.trim(),
        entorno: document.getElementById("entorno").value.trim(),
        user_agent: navigator.userAgent
      });

      if (error) {
        Swal.fire({
          icon: 'error',
          title: 'Error',
          text: 'No se pudo enviar el reporte',
          position: 'top',
          customClass: {
            popup: 'mi-borde-redondeado'
          },
          ...tema // Pasamos background, color y customClass automáticos
        });
      } else {
        await Swal.fire({
          icon: 'success',
          title: 'Reporte enviado',
          timer: 2000,
          showConfirmButton: false,
          position: 'top',
          customClass: {
            popup: 'mi-borde-redondeado'
          },
          ...tema
        });
        form.reset();
      }

      btn.disabled = false;
      btn.textContent = "Enviar reporte";
    });
  </script>
</body>
</html>
