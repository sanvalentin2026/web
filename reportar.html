<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Reportar un problema</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://unpkg.com; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://fonts.googleapis.com; style-src-elem 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com; img-src 'self' data:; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://cdn.jsdelivr.net;">

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext x='50%25' y='50%25' dominant-baseline='central' text-anchor='middle' font-size='80'%3E❤️%3C/text%3E%3C/svg%3E">

<link rel="mask-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext x='50%25' y='50%25' dominant-baseline='central' text-anchor='middle' font-size='80'%3E❤️%3C/text%3E%3C/svg%3E" color="#ff375f">
    <!-- Scripts moved to end of body for better performance -->
  <link rel="stylesheet" href="css/common.css">
  <link rel="stylesheet" href="css/reportar.css">
      <script>
    // Este código se ejecuta ANTES de que el body exista
    (function() {
        const guardado = localStorage.getItem('tema-usuario') || 'modo-claro';
        document.documentElement.className = guardado;
        
        // Sincronizar el color de fondo del HTML de inmediato
        const color = (guardado === 'modo-oscuro') ? '#1c1c1e' : '#ffffff';
        document.documentElement.style.backgroundColor = color;
    })();
</script>
</head>
<body>
    <div id="loader-global" class="loader-overlay">
    <div class="apple-spinner"></div>
    </div>

  <!-- Scripts moved to end of body for better performance -->

  <button class="btn-volver" onclick="history.back()">← Volver atrás</button>
  
  <div class="container">
    <h1>Reportar un problema</h1>
    <div class="version-container">
    Version actual: <span class="version-number">v1.4.0 | RC-3</span>
    </div>

    <form id="formReporte">
      <label for="tipo">Tipo de reporte</label>
      <select id="tipo" required>
        <option value="soporte">Soporte</option>
        <option value="error">Error / No funciona</option>
        <option value="visual">Problema visual</option>
        <option value="lento">Lentitud</option>
        <option value="otro">Otro</option>
      </select>

      <label for="descripcion">¿Qué ocurrió?</label>
      <textarea id="descripcion" placeholder="Describa que paso" required></textarea>

      <label for="version">Versión de la web</label>
      <input id="version" placeholder="Ej: v1.4.0 | RC-3 (Actual)" required>

      <label for="entorno">Dispositivo y navegador</label>
      <input id="entorno" placeholder="Ej: iPhone · Safari" required>

      <button type="submit" id="btnEnviar">Enviar reporte</button>
    </form>
  </div>
    <footer class="main-footer">
        <div class="footer-content">
            <p class="copyright">&copy; 2026 Todos los derechos reservados</p>
        </div>
    </footer>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/reportar_extra.js" type="module"></script>
  <script type="module" src="js/prescense.js"></script>
</body>
</html>
