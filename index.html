<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>San Valentin 26 | Principal</title>
    <script src="js/themes.js"></script>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/common.css">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext x='50%25' y='50%25' dominant-baseline='central' text-anchor='middle' font-size='80'%3E❤️%3C/text%3E%3C/svg%3E">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400..700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/special.css">
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/driver.js@1.0.1/dist/driver.css"/>
    <script>
    (function() {
        const guardado = localStorage.getItem('tema-usuario') || 'modo-claro';
        document.documentElement.className = guardado;
        
        const color = (guardado === 'modo-oscuro') ? '#1c1c1e' : '#ffffff';
        document.documentElement.style.backgroundColor = color;
    })();
</script>
</head>



<body>
    <div id="loader-global" class="loader-overlay">
    <div class="apple-spinner"></div>
    </div>
    <script>
        const session = JSON.parse(localStorage.getItem("usuario") || "{}");
        if (!session.permisos || session.permisos === "false") {
            window.stop();
            window.location.replace("login.html");
        } else {
            document.addEventListener('DOMContentLoaded', function() {
                document.body.style.display = "block";
            });
        }
    </script>

    <header class="main-header" id="header">
        <div class="header-container">
            <div class="header-logo">
                <h1>San Valentín</h1>
            </div>
<nav class="header-actions">
    <a href="stock.html" class="action-btn" title="Inventario">
        <i class="fa-solid fa-box"></i>
    </a>

    <a href="stats.html" class="action-btn" title="Estadísticas">
        <svg 
            width="1.1rem" 
            height="1.1rem" 
            viewBox="0 0 24 24" 
            fill="none" 
            xmlns="http://www.w3.org/2000/svg"
            style="display: inline-block; vertical-align: middle;">
            <path d="M21 22H3V2" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
            <rect x="6" y="14" width="3.5" height="5" rx="1.75" fill="currentColor"/>
            <rect x="12" y="8" width="3.5" height="11" rx="1.75" fill="currentColor"/>
            <rect x="18" y="3" width="3.5" height="16" rx="1.75" fill="currentColor"/>
        </svg>
    </a>

    <button id="btnPDF" class="action-btn" title="Descargar PDF">
        <i class="fa-solid fa-file-pdf"></i>
    </button>

    <a href="porfile.html" class="action-btn" title="Mi Perfil">
        <i class="fa-solid fa-user"></i>
    </a>
</nav>
        </div>
    </header>

    <main class="content-wrapper">
        <form id="pedidoForm">
            <input type="text" id="nombre" placeholder="Nombre del comprador:" required>
            <select id="seccion" required></select>
            <input type="text" id="receptor" placeholder="Nombre del receptor:" required>
            <select id="seccion_receptor" required></select>
            
            <select id="producto" required>
                <option value="" disabled selected>Seleccione un producto</option>
                
<optgroup label="- Servicios -">
    <option value="Baile" data-precio="0">Baile</option>
    <option value="Boda" data-precio="0">Boda</option>
    <option value="Kiss or Slap" data-precio="0">Kiss or Slap</option>
    <option value="Serenata" data-precio="0">Serenata</option>
    <option value="Aprete" data-precio="0">Aprete</option>
    <option value="Pico" data-precio="0">Pico</option>
    <option value="Semana inglesa" data-precio="0">Semana Inglesa</option>
</optgroup>

<optgroup label="- Comida -">
    <option value="Alfajor" data-precio="0">Alfajor</option>
    <option value="Alfajor cubierto" data-precio="0">Alfajor cubiero</option>
    <option value="Brownie" data-precio="0">Brownie</option>
    <option value="Cupcakes" data-precio="0">Cupcakes</option>
    <option value="Dona" data-precio="0">Dona</option>
    <option value="Marshmellows" data-precio="0">Marshmellows</option>
    <option value="Palomitas" data-precio="0">Palomitas</option>
</optgroup>

<optgroup label="- Flores -">
    <option value="Flor sola" data-precio="0">Flor sola</option>
    <option value="Ramo de 3 flores" data-precio="0">Ramo de 2 flores</option>
    <option value="Ramo de 2 flores" data-precio="0">Ramo de 3 flores</option>
</optgroup>

<optgroup label="- Fotos -">
    <option value="Foto con camara" data-precio="0">Foto con cámara</option>
    <option value="Foto con camara e impresion" data-precio="0">Foto con cámara e impresión</option>
    <option value="Foto con telefono y fondo" data-precio="0">Foto con teléfono y fondo</option>
</optgroup>

<optgroup label="- Otros -">
    <option value="Buzon de confesiones" data-precio="0">Buzón de confesiones</option>
    <option value="Globo" data-precio="0">Globo</option>
</optgroup>

            </select>

            <textarea id="detalles" placeholder="Detalles o notas (opcional):" rows="2"></textarea>
            <button class="crear" type="submit">Registrar el pedido</button>
        </form>

        <div class="controls">
            <div class="search-box">
            <input type="text" id="buscador" placeholder="Buscar un pedido por caracteristicas">
            <i class="fa-solid fa-magnifying-glass"></i>
            </div>
            <select id="filtroSeccion">
                <option value="">Filtrar busqueda por secciones</option>
                <option value="7-1">7-1</option> <option value="7-2">7-2</option>
                <option value="8-1">8-1</option> <option value="8-2">8-2</option>
                <option value="9-1">9-1</option> <option value="9-2">9-2</option>
                <option value="10-1">10-1</option> <option value="10-2">10-2</option>
                <option value="11-1">11-1</option> <option value="11-2">11-2</option>
            </select>
        </div>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>ID pedido</th>
                        <th>De</th>
                        <th>Para</th>
                        <th>Producto</th>
                        <th>Detalles</th>
                        <th>Estado</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="pedidosBody"></tbody>
            </table>
        </div>

        <div id="paginacion" class="paginacion">
            <button id="prevPage">←</button>
            <span id="infoPagina"></span>
            <button id="nextPage">→</button>
        </div>
    </main>

        <footer class="main-footer">
        <div class="footer-content">
            <p class="copyright">&copy; 2026 Todos los derechos reservados.</p>
        </div>
    </footer>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/driver.js@1.0.1/dist/driver.js.iife.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-config.js"></script>
    <script src="js/header.js"></script>
    <script type="module" src="js/process.js"></script>
    <script type="module" src="js/prescense.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</body>
</html>
