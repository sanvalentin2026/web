<script>
        // BLOQUEO INMEDIATO: Si el usuario no tiene permisos en el storage, 
        // ni siquiera dejamos que el navegador descargue el resto de la página.
        const session = JSON.parse(localStorage.getItem("usuario") || "{}");
        if (!session.permisos || session.permisos === "false") {
            window.stop(); // Detiene la carga de la página
            window.location.replace("login.html");
        }
    </script>

<body style="display: none;">
   <script>
        // Si no hay usuario en el storage, ni siquiera cargues el resto del HTML
        if (!localStorage.getItem("usuario")) {
            window.location.replace("login.html");
        } else {
            document.body.style.display = "block";
        }

<header class="main-header" id="header">
    <div class="header-container">
        <div class="header-logo">
            <h1>San Valentín</h1>

<nav class="header-actions">

<form id="pedidoForm">
  <input type="text" id="nombre" placeholder="Nombre del comprador:" required>
  <select id="seccion" required></select>
  <input type="text" id="receptor" placeholder="Nombre del receptor:" required>
  <select id="seccion_receptor" required></select>
  <input type="text" id="producto" placeholder="Producto (Tipo):" required>
  <textarea
  id="detalles"
  placeholder="Detalles o notas del pedido (opcional):"
  rows="3"
></textarea>
  <button type="submit">Crear pedido</button>
</form>


<div class="controls">
  <div class="orden-container">
    <ul id="menuOrdenar" class="menu-oculto">
      <li data-orden="created_at_desc">Fecha descendente</li>

      <li data-orden="seccion_desc">Sección descendente</li>
      <li data-orden="seccion_custom">Secciones personalizadas</li>
      <li data-orden="id_asc">ID ascendente</li>
      <li data-orden="id_desc">ID descendente</li>
    </ul>
  </div>
  <input type="text" id="buscador" placeholder="Buscar pedido por sus caracteristicas">
  <select id="filtroSeccion">

    <option value="10-3">10-3</option>
    <option value="10-4">10-4</option>
    <option value="11-1">11-1</option>
    <option value="11-2">11-2</option>
    <option value="11-3">11-3</option>

  </select>

<table>
