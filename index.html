<!DOCTYPE html>
<html lang="es">
<head>
<script>
    (function() {
        const sesionRaw = localStorage.getItem("usuario");
        
        if (!sesionRaw) {
            window.location.replace("login.html");
            return;
        }

        const sesion = JSON.parse(sesionRaw);
        // Si NO es true y NO es "true", para afuera
        if (sesion.permisos !== true && sesion.permisos !== "true") {
            window.location.replace("login.html");
        }
    })();
</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="theme-color" content="#E11D48">

<meta name="referrer" content="strict-origin-when-cross-origin">
<meta http-equiv="X-Content-Type-Options" content="nosniff">

<title>Pedidos San Valentin</title>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/changelog.css">
<link rel="icon" href="data:image/svg+xml,
<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'>
  <text y='0.9em' font-size='90'>❤️</text>
</svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400..700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>

<header class="main-header">
    <div class="header-container">
        <div class="header-logo">
            <h1>San Valentín</h1>
        </div>
        
        <nav class="header-actions">
            <a href="reportar.html" class="action-btn report-btn" title="Reportar un error">
                <i class="fa-solid fa-bug"></i>
            </a>

            <button id="btn-tema" class="action-btn" title="Cambiar tema">
                <i class="fa-solid fa-moon" id="theme-icon"></i>
            </button>

            <button onclick="logout()" class="action-btn logout" title="Cerrar Sesión">
                <i class="fa-solid fa-right-from-bracket"></i>
            </button>
        </nav>
    </div>
</header>


<form id="pedidoForm">
  <input type="text" id="nombre" placeholder="Nombre del comprador:" required>
  <select id="seccion" required></select>
  <input type="text" id="receptor" placeholder="Nombre del receptor:" required>
  <select id="seccion_receptor" required></select>
  <input type="text" id="producto" placeholder="Producto (Tipo):" required>
  <textarea
  id="detalles"
  placeholder="Detalles o notas del pedido (opcional):"
  rows="3"
></textarea>
  <button type="submit">Crear pedido</button>
</form>

<div class="controls">
  <div class="orden-container">
    <ul id="menuOrdenar" class="menu-oculto">
      <li data-orden="created_at_desc">Fecha descendente</li>
      <li data-orden="seccion_asc">Sección ascendente</li>
      <li data-orden="seccion_desc">Sección descendente</li>
      <li data-orden="seccion_custom">Secciones personalizadas</li>
      <li data-orden="id_asc">ID ascendente</li>
      <li data-orden="id_desc">ID descendente</li>
    </ul>
  </div>
  <input type="text" id="buscador" placeholder="Buscar pedido por caracteristicas">
  <select id="filtroSeccion">
    <option value="">Filtrar busqueda por secciones</option>
    <option value="7-1">7-1</option>
    <option value="7-2">7-2</option>
    <option value="7-3">7-3</option>
    <option value="7-4">7-4</option>
    <option value="8-1">8-1</option>
    <option value="8-2">8-2</option>
    <option value="8-3">8-3</option>
    <option value="8-4">8-4</option>
    <option value="9-1">9-1</option>
    <option value="9-2">9-2</option>
    <option value="9-3">9-3</option>
    <option value="9-4">9-4</option>
    <option value="10-1">10-1</option>
    <option value="10-2">10-2</option>
    <option value="10-3">10-3</option>
    <option value="10-4">10-4</option>
    <option value="11-1">11-1</option>
    <option value="11-2">11-2</option>
    <option value="11-3">11-3</option>
    <option value="11-4">11-4</option>
  </select>
</div>

<table>
  <thead>
    <tr>
      <th>ID del pedido:</th>
      <th>De:</th>
      <th>Para:</th>
      <th>Producto:</th>
      <th>Detalles o notas:</th>
      <th>Estado de pago:</th>
      <th>Acciones:</th>
    </tr>
  </thead>
  <tbody id="pedidosBody"></tbody>
</table>
<div id="paginacion" class="paginacion">
  <button id="prevPage">⬅ Anterior</button>
  <span id="infoPagina"></span>
  <button id="nextPage">Siguiente ➡</button>
</div>
<script type="module">
    import { verificarSesion } from './js/auth.js';
    
    // Al cargar index.html, verificamos sesión
    verificarSesion().catch(err => {
        console.error("Sesión no válida:", err);
        // IMPORTANTE: Redirigir fuera de aquí
        window.location.replace("login.html");
    });
</script>
<script type="module" src="js/auth.js"></script>
</script>
<script src="js/header.js"></script>
<script src="js/themes.js"></script>
<script type="module" src="js/connection_db.js"></script>
</body>
</html>
