<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>San Valentín 26 | Inventario</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
        <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext x='50%25' y='50%25' dominant-baseline='central' text-anchor='middle' font-size='80'%3E❤️%3C/text%3E%3C/svg%3E">
    
    <link rel="stylesheet" href="css/stock.css">
    <link rel="stylesheet" href="css/common.css">

    <script>
        // BLOQUEO DE FLASH: Se ejecuta antes de pintar nada
        (function() {
            const tema = localStorage.getItem('tema-usuario') || 'modo-claro';
            document.documentElement.className = tema;
            // Color de fondo inmediato para el canvas del navegador
            document.documentElement.style.backgroundColor = (tema === 'modo-oscuro') ? '#0a0a0a' : '#FFF0F6';
            
            const session = JSON.parse(localStorage.getItem("usuario") || "{}");
            if (!session.permisos || session.permisos === "false") {
                window.location.replace("login.html");
            }
        })();
    </script>

    <script type="module" src="js/stock.js"></script>
</head>
<body>
    <div id="loader-global" class="loader-overlay">
    <div class="apple-spinner"></div>
    </div>
    <div class="container">
        <header class="nav-header">
            <button onclick="window.history.back()" class="btn-back"><i class="fa-solid fa-arrow-left"></i></button>
            <div class="header-info">
                <i class="fa-solid fa-box"></i>
                <h1>Inventario</h1>
            </div>
        </header>

        <div class="table-container">
            <table class="inventory-table">
                <thead>
                    <tr>
                        <th class="col-name">Producto</th>
                        <th class="col-status">Estado</th>
                        <th class="col-qty">Cant.</th>
                    </tr>
                </thead>
                <tbody id="inventoryBody"></tbody>
            </table>
        </div>
    </div>

    <footer class="main-footer">
        <div class="footer-content">
            <p class="copyright">&copy; 2026 Todos los derechos reservados.</p>
        </div>
    </footer>
</body>
</html>
