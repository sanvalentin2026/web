<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventario</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
        <link rel="apple-touch-icon" href="https://fav.farm/❤️">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext x='50%25' y='50%25' dominant-baseline='central' text-anchor='middle' font-size='80'%3E❤️%3C/text%3E%3C/svg%3E">
    <link rel="mask-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext x='50%25' y='50%25' dominant-baseline='central' text-anchor='middle' font-size='80'%3E❤️%3C/text%3E%3C/svg%3E" color="#ff375f">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-config.js"></script>
    <script type="module">
        import { verificarSesion } from './js/auth.js';
        verificarSesion().catch(err => {
            window.location.replace("login.html");
        });
    </script>
    <style>
        :root {
            --status-ok: #10b981;
            --status-warn: #f59e0b;
            --status-crit: #ef4444;
            --accent: #ff375f;
        }

        /* Tema Oscuro */
        body.modo-oscuro {
            --bg: #0a0a0a;
            --border: #262626;
            --card: #111111;
            --text-main: #ededed;
            --text-muted: #a1a1a1;
            --header-bg: #161616;
        }

        /* Tema Claro */
        body.modo-claro {
            --bg: #FFF0F6;
            --border: #e5e5e5;
            --card: #f9f9f9;
            --text-main: #1a1a1a;
            --text-muted: white;
            --header-bg: #ff375f;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            margin: 0;
            padding: 15px;
            transition: background 0.2s ease;
        }

        .container { max-width: 800px; margin: 0 auto; }

        .nav-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid var(--border);
        }

        .header-info h1 { font-size: 1.1rem; margin: 0; font-weight: 700; color:#ff375f ; }

        .btn-back {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 8px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: 600;
        }

        .table-container {
            width: 100%;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 10px;
            overflow: hidden;
        }

        .inventory-table { width: 100%; border-collapse: collapse; table-layout: fixed; }

        th {
            background: var(--header-bg);
            padding: 12px;
            font-size: 0.7rem;
            text-transform: uppercase;
            color: var(--text-muted);
            border-bottom: 1px solid var(--border);
            text-align: left;
        }

        td {
            padding: 14px 12px;
            border-bottom: 1px solid var(--border);
            font-size: 0.9rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .status-dot { height: 7px; width: 7px; border-radius: 50%; display: inline-block; margin-right: 6px; }
        .dot-ok { background: var(--status-ok); }
        .dot-warn { background: var(--status-warn); }
        .dot-crit { background: var(--status-crit); }

        .qty-box { font-family: monospace; font-weight: 700; text-align: right; display: block; }
        .out-text { color: var(--status-crit); font-weight: 800; }
        
        .col-name { width: 50%; }
        .col-status { width: 30%; }
        .col-qty { width: 20%; text-align: right; }
    </style>
</head>
<body>

    <div class="container">
        <header class="nav-header">
        <button onclick="window.history.back()" class="btn-back">← Volver atras</button>
            <div class="header-info">
                <h1>Inventario</h1>
            </div>
        </header>

        <div class="table-container">
            <table class="inventory-table">
                <thead>
                    <tr>
                        <th class="col-name">Producto</th>
                        <th class="col-status">Estado</th>
                        <th class="col-qty">Cant.</th>
                    </tr>
                </thead>
                <tbody id="inventoryBody"></tbody>
            </table>
        </div>
    </div>

    <script type="module">
        const nombresPlurales = {
            "Alfajor": "Alfajores",
            "Fresa con chocolate": "Fresas con chocolate",
            "Ramo de fresa": "Ramos de fresas",
            "Bomba de chocolate": "Bombas de chocolate",
            "Brownie": "Brownies",
            "Galleta": "Galletas",
            "Cakepop": "Cakepops",
            "Dona": "Donas",
            "Oblea": "Obleas",
            "Flor sola": "Flores solas",
            "Ramo de 3 flores": "Ramos de 3 flores",
            "Globo": "Globos",
            "Pulsera": "Pulseras",
            "Foto con camara e impresion": "Fotos con cámara e impresión"
        };

        async function updateTable() {
            const tbody = document.getElementById('inventoryBody');
            if (!tbody) return;

            const { data, error } = await db
                .from('productos')
                .select('nombre, stock_disponible')
                .eq('tipo', 'fisico')
                .order('nombre', { ascending: true });

            if (error) return;

            tbody.innerHTML = "";

            data.forEach(item => {
                const isOut = item.stock_disponible <= 0;
                const isLow = item.stock_disponible > 0 && item.stock_disponible < 10;
                const nombreAMostrar = nombresPlurales[item.nombre] || (item.nombre.endsWith('s') ? item.nombre : item.nombre + 's');

                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td title="${nombreAMostrar}">${nombreAMostrar}</td>
                    <td>
                        <span class="status-dot ${isOut ? 'dot-crit' : (isLow ? 'dot-warn' : 'dot-ok')}"></span>
                        <span style="font-size: 0.8rem;">${isOut ? 'Agotado' : (isLow ? 'Poco inventario' : 'Disponible')}</span>
                    </td>
                    <td class="col-qty">
                        <span class="qty-box ${isOut ? 'out-text' : ''}">${item.stock_disponible}</span>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        function aplicarTema() {
            // Usamos document.body directamente para evitar errores de selección
            const tema = localStorage.getItem('tema-usuario') || 'modo-oscuro';
            document.body.className = tema;
        }

        // Inicialización robusta
        function init() {
            aplicarTema();
            updateTable();
            
            db.channel('stock-realtime')
                .on('postgres_changes', { event: '*', schema: 'public', table: 'productos' }, updateTable)
                .subscribe();
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }
    </script>
</body>
</html>
