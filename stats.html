<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estadísticas</title>
    
    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    <link rel="stylesheet" href="css/stats.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext x='50%25' y='50%25' dominant-baseline='central' text-anchor='middle' font-size='80'%3E❤️%3C/text%3E%3C/svg%3E">

<link rel="mask-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext x='50%25' y='50%25' dominant-baseline='central' text-anchor='middle' font-size='80'%3E❤️%3C/text%3E%3C/svg%3E" color="#ff375f">

<link rel="apple-touch-icon" href="https://fav.farm/❤️">
</head>
<body class="modo-oscuro"> <div class="container">
    <header class="header">
        <button class="btn-volver" onclick="history.back()">
            <i class="fas fa-arrow-left"></i> Volver atrás
        </button>
        <h1><i class="fas fa-chart-line"></i> Estadísticas</h1>
    </header>

    <main class="grid-stats">
        <section class="card">
            <h3>Total Aproximado</h3>
            <p id="totalRecaudado">₡0</p>
        </section>
        
        <section class="card">
            <h3>Pedidos TOTALES</h3>
            <p id="ventasPagadas">0</p>
        </section>

        <section class="card">
            <h3>Producto más vendido</h3>
            <p id="productoEstrella">...</p>
        </section>

        <section class="card">
            <h4><i class="fas fa-trophy"></i> Top 3 Vendedores</h4>
            <div id="rankingUsuarios"></div>
        </section>
    </main>

    <section class="chart-container">
        <h3><i class="fas fa-chart-bar"></i> Grafico Semanal</h3>
        <div style="height: 280px; position: relative;">
            <canvas id="graficoVentas"></canvas>
        </div>
    </section>
</div>

<script type="module" src="js/estadisticas.js"></script>

</body>
</html>
